<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 315" width="600" height="315" role="img" aria-label="The Flush Finder">
  <defs><clipPath id="c"><rect width="600" height="315" rx="16"/></clipPath></defs>
  <style>
    .ring { transform-origin: 300px 158px; animation: ring 3.6s ease-out infinite; }
    .r2 { animation-delay: -1.2s; } .r3 { animation-delay: -2.4s; }
    @keyframes ring { from { transform: scale(0.45); opacity: 0.55; } to { transform: scale(1.9); opacity: 0; } }
    .bob { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(5px); } 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="600" height="315" fill="#FED301"/>
    <g fill="none" stroke="#111" stroke-width="5">
      <circle class="ring" cx="300" cy="158" r="120"/><circle class="ring r2" cx="300" cy="158" r="120"/><circle class="ring r3" cx="300" cy="158" r="120"/>
    </g>
    <g class="bob"><image x="170" y="28" width="260" height="260" href="data:image/png;base64,"/></g>
  </g>
</svg>
