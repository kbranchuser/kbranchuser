<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kbranch, Senior Cloud Engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#14306b"/>
      <stop offset="1" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a8c7fa"/>
    </linearGradient>
    <g id="cloud">
      <circle cx="60" cy="60" r="38"/>
      <circle cx="110" cy="44" r="50"/>
      <circle cx="168" cy="58" r="40"/>
      <circle cx="212" cy="70" r="28"/>
      <rect x="40" y="62" width="196" height="38" rx="19"/>
    </g>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .drift-a { animation: drift 46s linear infinite; }
    .drift-b { animation: drift 64s linear infinite; animation-delay: -20s; }
    .drift-c { animation: drift 82s linear infinite; animation-delay: -50s; }
    .drift-d { animation: drift 58s linear infinite; animation-delay: -38s; }
    @keyframes drift { from { transform: translateX(-320px); } to { transform: translateX(1260px); } }
    .star { animation: twinkle 3.2s ease-in-out infinite; }
    .s2 { animation-delay: -1.1s; } .s3 { animation-delay: -2.2s; } .s4 { animation-delay: -0.6s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
    .rise { animation: rise 1.4s ease-out both; }
    .rise2 { animation: rise 1.4s ease-out 0.35s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <g fill="#ffffff">
      <circle class="star" cx="90" cy="52" r="1.6"/>
      <circle class="star s2" cx="210" cy="118" r="1.2"/>
      <circle class="star s3" cx="330" cy="40" r="1.8"/>
      <circle class="star s4" cx="470" cy="84" r="1.2"/>
      <circle class="star s2" cx="610" cy="34" r="1.5"/>
      <circle class="star" cx="745" cy="70" r="1.2"/>
      <circle class="star s3" cx="880" cy="42" r="1.7"/>
      <circle class="star s4" cx="1010" cy="96" r="1.2"/>
      <circle class="star s2" cx="1120" cy="48" r="1.6"/>
      <circle class="star s3" cx="150" cy="200" r="1.1"/>
      <circle class="star" cx="1070" cy="190" r="1.1"/>
    </g>

    <g fill="#ffffff">
      <g class="drift-c" opacity="0.10"><use href="#cloud" transform="translate(0 28) scale(1.5)"/></g>
      <g class="drift-b" opacity="0.14"><use href="#cloud" transform="translate(0 150) scale(1.15)"/></g>
      <g class="drift-a" opacity="0.20"><use href="#cloud" transform="translate(0 214) scale(0.9)"/></g>
      <g class="drift-d" opacity="0.12"><use href="#cloud" transform="translate(0 84) scale(0.7)"/></g>
    </g>

    <text x="600" y="150" text-anchor="middle" font-size="72" font-weight="700" fill="url(#name)">Hi, I'm Kbranch</text>
    <text x="600" y="204" text-anchor="middle" font-size="27" font-weight="500" fill="#d2e3fc" letter-spacing="5">SENIOR CLOUD ENGINEER</text>

    <g>
      <circle class="pulse" cx="446" cy="247" r="5" fill="#34a853"/>
      <text x="462" y="254" font-size="19" fill="#a8c7fa">Google Cloud  ·  AWS  ·  AI agents</text>
    </g>
  </g>
</svg>
