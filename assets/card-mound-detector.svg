<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 315" width="600" height="315" role="img" aria-label="GA Mound Detector, a LiDAR scan sweeping over contour lines">
  <defs>
    <clipPath id="c"><rect width="600" height="315" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b1e"/><stop offset="1" stop-color="#17443f"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#5eead4" stop-opacity="0"/><stop offset="1" stop-color="#5eead4" stop-opacity="0.45"/></linearGradient>
  </defs>
  <style>
    .scan { animation: scan 4.5s linear infinite; }
    @keyframes scan { from { transform: translateX(-140px); } to { transform: translateX(640px); } }
    .hit { transform-origin: 392px 138px; animation: hit 4.5s ease-out infinite; animation-delay: 2.6s; opacity: 0; }
    @keyframes hit { 0% { transform: scale(0.5); opacity: 0.9; } 45%, 100% { transform: scale(1.5); opacity: 0; } }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="600" height="315" fill="url(#bg)"/>
    <g fill="none" stroke="#5eead4" stroke-width="1.6" opacity="0.5">
      <g transform="translate(392 138)"><ellipse cx="0" cy="0" rx="26" ry="16"/><ellipse cx="0" cy="0" rx="48" ry="29"/><ellipse cx="0" cy="0" rx="72" ry="44"/><ellipse cx="0" cy="0" rx="98" ry="60"/><ellipse cx="0" cy="0" rx="126" ry="78"/></g>
      <g transform="translate(150 96) scale(0.55)" opacity="0.7"><ellipse cx="0" cy="0" rx="26" ry="16"/><ellipse cx="0" cy="0" rx="48" ry="29"/><ellipse cx="0" cy="0" rx="72" ry="44"/><ellipse cx="0" cy="0" rx="98" ry="60"/><ellipse cx="0" cy="0" rx="126" ry="78"/></g>
      <path d="M-10 262 C120 228 210 286 330 256 C440 228 520 270 610 244"/>
      <path d="M-10 290 C130 258 230 310 340 284 C450 258 530 296 610 274"/>
    </g>
    <circle class="hit" cx="392" cy="138" r="34" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <g class="scan"><rect width="120" height="315" fill="url(#beam)"/><rect x="118" width="2.5" height="315" fill="#99f6e4"/></g>
    <text x="30" y="250" font-size="34" font-weight="700" fill="#ffffff">GA Mound Detector</text>
    <text x="30" y="282" font-size="17" fill="#99f6e4" letter-spacing="3">LIDAR + DEEP LEARNING</text>
  </g>
</svg>
